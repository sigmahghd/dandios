name: Dandelion XNU (experimental)

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: "environment = check tools only; build = dependencies + kernel attempt"
        required: true
        type: choice
        options:
          - build
          - environment
        default: build

permissions:
  contents: read

concurrency:
  group: dandelion-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  xnu:
    # TEMPORARY: macos-14/Xcode15 is scheduled for retirement 2026-11-02.
    # Do not silently switch to macos-latest: the old XNU recipe needs validation.
    runs-on: macos-14
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      MODE: ${{ inputs.mode }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout public sources (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and unpack public source bundle
        shell: python3 {0}
        run: |
          import hashlib, pathlib, tarfile, shutil
          archive = pathlib.Path("source-bundle.tar.gz")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != "6fd5f24970b02ac703fefe134ecd52affab965689dad2ee7ecfa1d48393d9acb":
              raise SystemExit("STOP: source bundle SHA256 mismatch")
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if len(members) > 10000 or sum(m.size for m in members) > 256*1024*1024:
                  raise SystemExit("STOP: unexpected source bundle limits")
              planned = []
              for m in members:
                  parts = pathlib.PurePosixPath(m.name).parts
                  if not m.isfile() or not parts or parts[0] != "dandelion-xnu-port" or ".." in parts:
                      raise SystemExit("STOP: unexpected archive member")
                  rel = pathlib.Path(*parts[1:])
                  if str(rel) == ".github/workflows/dandelion-xnu.yml":
                      continue
                  if not parts[1:] or m.size > 16*1024*1024:
                      raise SystemExit("STOP: unexpected source file")
                  planned.append((m, rel))
              for m, rel in planned:
                  rel.parent.mkdir(parents=True, exist_ok=True)
                  with tf.extractfile(m) as source, rel.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  rel.chmod(0o755 if m.mode & 0o111 else 0o644)
          # Only ARM64 kernel headers were installed; no x86_64 target dependency is needed.
          recipe = pathlib.Path("ci/prepare_dependencies.py")
          text = recipe.read_text()
          old = 'ARCHS="x86_64 arm64" VALID_ARCHS="x86_64 arm64"'
          if text.count(old) != 1:
              raise SystemExit("STOP: unexpected firehose architecture recipe")
          recipe.write_text(text.replace(old, 'ARCHS="arm64" VALID_ARCHS="arm64"'))
          # Dandelion does not link Apple-platform KDK archives (MakeInc.def).
          # Kernel headers come from the source-built fakeroot, not the debug kit.
          runner = pathlib.Path("build_support/build_kernel_macos.py")
          text = runner.read_text()
          old = " if not list(kdk.rglob('Kernel.framework')):errors.append('KDK does not contain Kernel.framework')"
          new = " if not (fakeroot/'System/Library/Frameworks/Kernel.framework/PrivateHeaders/mach/mach_types.h').is_file():errors.append('prepared fakeroot missing exported XNU mach headers')"
          if text.count(old) != 1:
              raise SystemExit("STOP: unexpected kernel preflight recipe")
          runner.write_text(text.replace(old, new))
          # CI-discovered source fixes: missing barrier constants and 36-bit user VA.
          import json
          updates = [('iokit/Kernel/arm/DandelionCPU.cpp', '#include <arm64/proc_reg.h>', '#include <arm64/proc_reg.h>\n#include <arm/atomic.h>', 'cb0fbf05bb177254c134bfd393151a3b638a565d8d49df0dfad9a81458397ed1', 'a8ee8396000ef5f4215fb413c1826b5648049d0937c4a2263ff0251df58c746d'), ('osfmk/mach/arm/vm_param.h', '#if (defined(XNU_PLATFORM_MacOSX) || defined(XNU_PLATFORM_DriverKit)) && !defined(A5XELTE)', '#if (defined(XNU_PLATFORM_MacOSX) || defined(XNU_PLATFORM_DriverKit)) && !defined(A5XELTE) && !defined(DANDELION)', '61f13aaa8dbce71733aecb612d2a8cf16689dea10d264f72a7bf59beb7b30afc', '9f207259b4211b0a185c45cc4b97c213fd1c34b10a72d77aa638d72e158f183c')]
          manifest_path = pathlib.Path("SOURCE_TREE_SHA256.json")
          manifest = json.loads(manifest_path.read_text())
          for name, old, new, before, after in updates:
              path = pathlib.Path("work/xnu") / name
              text = path.read_text()
              if hashlib.sha256(text.encode()).hexdigest() != before or manifest[name] != before or text.count(old) != 1:
                  raise SystemExit("STOP: source overlay precondition " + name)
              text = text.replace(old, new)
              if hashlib.sha256(text.encode()).hexdigest() != after:
                  raise SystemExit("STOP: source overlay result " + name)
              path.write_text(text)
              manifest[name] = after
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          # CI-discovered source fixes: use public atomic header and omit unused hardware SHA2 assembly.
          import json
          updates = [('iokit/Kernel/arm/DandelionCPU.cpp', '#include <arm/atomic.h>', '#include <machine/atomic.h>', 'a8ee8396000ef5f4215fb413c1826b5648049d0937c4a2263ff0251df58c746d', 'ac34774d55c866c5c334cbc6a9fbb942e65b09e24cffe1e38e1e104a4c6d9adc'), ('osfmk/arm64/corecrypto/sha256_compress_arm64.s', '#if defined(__arm64__)', '#if defined(__arm64__) && !defined(DANDELION)', '62c25e2bd0484a4e9b11834be07f7764a1d6836af33dd72140f9ab807a307df2', '8c32e5aba5b15d7f02bf21402955e26f5e8d33da60786f0ea5beaf98b54a35b0')]
          manifest_path = pathlib.Path("SOURCE_TREE_SHA256.json")
          manifest = json.loads(manifest_path.read_text())
          for name, old, new, before, after in updates:
              path = pathlib.Path("work/xnu") / name
              text = path.read_text()
              if hashlib.sha256(text.encode()).hexdigest() != before or manifest[name] != before or text.count(old) != 1:
                  raise SystemExit("STOP: source overlay precondition " + name)
              text = text.replace(old, new)
              if hashlib.sha256(text.encode()).hexdigest() != after:
                  raise SystemExit("STOP: source overlay result " + name)
              path.write_text(text)
              manifest[name] = after
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          # CI-discovered source fixes: use public atomic header and omit unused hardware SHA2 assembly.
          import json
          updates = [('osfmk/arm64/corecrypto/sha256_compress_arm64.s', '#if defined(__arm64__) && !defined(DANDELION)', '#if defined(__arm64__) && !defined(ARM64_BOARD_CONFIG_DANDELION)', '8c32e5aba5b15d7f02bf21402955e26f5e8d33da60786f0ea5beaf98b54a35b0', 'a1502c2830f66aab39c551e6d6ea2e23dfc706184f74ccabe192c283e9ae3dba')]
          manifest_path = pathlib.Path("SOURCE_TREE_SHA256.json")
          manifest = json.loads(manifest_path.read_text())
          for name, old, new, before, after in updates:
              path = pathlib.Path("work/xnu") / name
              text = path.read_text()
              if hashlib.sha256(text.encode()).hexdigest() != before or manifest[name] != before or text.count(old) != 1:
                  raise SystemExit("STOP: source overlay precondition " + name)
              text = text.replace(old, new)
              if hashlib.sha256(text.encode()).hexdigest() != after:
                  raise SystemExit("STOP: source overlay result " + name)
              path.write_text(text)
              manifest[name] = after
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print("Verified and extracted public sources; no phone captures or SDK included.")

      - name: Verify and unpack loader integration source
        shell: python3 {0}
        run: |
          import hashlib, pathlib, tarfile, shutil
          archive = pathlib.Path("loader-integration-source.tar.gz")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != "181fd456a0c6d66cfc73b59c651ed6525b4b5946ac5d0c88c549f6fa1b2f925a":
              raise SystemExit("STOP: loader integration source SHA256 mismatch")
          allowed = {'tests/REAL_KERNEL_INTEGRATION_RESULTS.json', 'tests/test_real_kernel_fixture.py', 'LOADER_INTEGRATION_RU.md', 'tools/pack_kernel_fixture.py'}
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if len(members) != len(allowed) or sum(m.size for m in members) > 1024*1024:
                  raise SystemExit("STOP: loader integration archive limits")
              planned = []
              for m in members:
                  parts = pathlib.PurePosixPath(m.name).parts
                  if not m.isfile() or not parts or parts[0] != "loader-integration" or ".." in parts:
                      raise SystemExit("STOP: loader integration member")
                  rel = pathlib.Path(*parts[1:])
                  if str(rel) not in allowed:
                      raise SystemExit("STOP: loader integration path")
                  allowed.remove(str(rel))
                  planned.append((m, rel))
              if allowed:
                  raise SystemExit("STOP: missing loader integration file")
              for m, rel in planned:
                  rel.parent.mkdir(parents=True, exist_ok=True)
                  with tf.extractfile(m) as source, rel.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  rel.chmod(0o644)

      - name: Verify and unpack handoff integration source
        shell: python3 {0}
        run: |
          import hashlib, pathlib, tarfile, shutil
          archive = pathlib.Path("handoff-integration-source.tar.gz")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != "e8c189d329b759099519d747ae1768d1c954df1562ac1fdd2b5480506cfda6b3":
              raise SystemExit("STOP: handoff source SHA256 mismatch")
          allowed = {'tests/PREPARE_HANDOFF_ARM64_RESULTS.json', 'tests/test_prepare_boot.py', 'tests/PREPARE_BOOT_RESULTS.json', 'tests/BUILD_HANDOFF.sh', 'loader/prepare_boot.c', 'loader/BUILD.sh', 'tests/emulate_prepare_handoff.py', 'tests/BRIDGE_ISA_RESULTS.json', 'tests/test_handoff_contract.py', 'loader/prepare_boot.h', 'platform/handoff_contract.h', 'tests/check_bridge_isa.py', 'platform/handoff_contract.c', 'loader/load.c', 'HANDOFF_INTEGRATION_RU.md'}
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if len(members) != len(allowed) or sum(m.size for m in members) > 1024*1024:
                  raise SystemExit("STOP: handoff source limits")
              planned = []
              for m in members:
                  parts = pathlib.PurePosixPath(m.name).parts
                  if not m.isfile() or not parts or parts[0] != "handoff-integration" or ".." in parts:
                      raise SystemExit("STOP: handoff source member")
                  rel = pathlib.Path(*parts[1:])
                  if str(rel) not in allowed:
                      raise SystemExit("STOP: handoff source path")
                  allowed.remove(str(rel))
                  planned.append((m, rel))
              if allowed:
                  raise SystemExit("STOP: handoff source missing file")
              for m, rel in planned:
                  rel.parent.mkdir(parents=True, exist_ok=True)
                  with tf.extractfile(m) as source, rel.open("wb") as output:
                      shutil.copyfileobj(source, output)
                  rel.chmod(0o755 if m.mode & 0o111 else 0o644)

      - name: Check environment and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            sw_vers
            uname -m
            df -h .
            test -d "$DEVELOPER_DIR"
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-path
            xcrun --sdk macosx --find clang
            xcrun --sdk macosx --find iig
            python3 ci/check_snapshot.py
          } 2>&1 | tee ci-logs/environment.log

      - name: Install verified KDK 13.5 in disposable runner
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/install_kdk.py 2>&1 | tee ci-logs/kdk-install.log

      - name: Build pinned public dependencies
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/prepare_dependencies.py 2>&1 | tee ci-logs/dependencies.log

      - name: Preflight full build inputs
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          python3 build_support/build_kernel_macos.py --check             --fakeroot "$FAKEROOT_DIR" --kdk "$KDKROOT"             2>&1 | tee ci-logs/kernel-preflight.log

      - name: Attempt DEVELOPMENT ARM64 DANDELION build
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          python3 build_support/build_kernel_macos.py --build             --fakeroot "$FAKEROOT_DIR" --kdk "$KDKROOT"             --out "$GITHUB_WORKSPACE/build/macos-dandelion" --jobs 3             2>&1 | tee ci-logs/kernel-runner.log

      - name: Test actual built kernel through loader (synthetic RAM only)
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_SHA="$(python3 -c 'import json; print(json.load(open("build/macos-dandelion/build-result.json"))["artifact"]["sha256"])')"
          python3 tests/test_real_kernel_fixture.py --kernel build/macos-dandelion/xnu.obj/kernel.development.dandelion --expect-sha256 "$KERNEL_SHA" --out build/offline-real-kernel 2>&1 | tee ci-logs/loader-integration.log

      - name: Test pre-copy handoff memory contract (host, not phone)
        if: inputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_SHA="$(python3 -c 'import json; print(json.load(open("build/macos-dandelion/build-result.json"))["artifact"]["sha256"])')"
          python3 tests/test_handoff_contract.py 2>&1 | tee ci-logs/handoff-contract.log
          python3 tests/test_prepare_boot.py --kernel build/macos-dandelion/xnu.obj/kernel.development.dandelion --expect-sha256 "$KERNEL_SHA" --out build/offline-prepare-boot 2>&1 | tee ci-logs/prepare-boot.log

      - name: Preserve logs even on build failure (no SDK/KDK/captures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dandelion-logs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ci-logs/*.log
            build/macos-dandelion/build.log
            build/macos-dandelion/build-result.json
            build/offline-real-kernel/results.json
            build/offline-prepare-boot/results.json

      - name: Preserve built kernel (NOT a flash image)
        if: success() && inputs.mode == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dandelion-kernel-NOT-FLASHABLE-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: build/macos-dandelion/xnu.obj/kernel.development.dandelion
