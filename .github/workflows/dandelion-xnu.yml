      - name: Verify and unpack register cache probe source (no private images)
        shell: python3 {0}
        run: |
          import hashlib, pathlib, tarfile, shutil, base64, io
          archive = pathlib.Path("register-cache-probe-source-v2.tar.gz.b64")
          blob = base64.b64decode(archive.read_bytes().strip(), validate=True)
          if hashlib.sha256(blob).hexdigest() != "480af30859d5003e369d1fd1f1b46a91e460f0714d3dab8cfcaa0404d5a1bb80":
